name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout companion path dependencies
        run: |
          git clone --depth=1 https://github.com/ForeverAngry/rig-tap ../rig-tap
          git clone --depth=1 https://github.com/ForeverAngry/rig-model-meta ../rig-model-catalog
          git clone --depth=1 https://github.com/ForeverAngry/rig-memvid ../rig-memvid
          git clone --depth=1 https://github.com/ForeverAngry/rig-evals-rag ../rig-evals-rag
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "default"
          - "no-default"
          - "cache-semantic"
          - "cache-memvid"
          - "compress-llmlingua"
          - "route-predictive"
          - "lineage"
          - "eval"
          - "all-features"
    steps:
      - uses: actions/checkout@v4
      - name: checkout companion path dependencies
        run: |
          git clone --depth=1 https://github.com/ForeverAngry/rig-tap ../rig-tap
          git clone --depth=1 https://github.com/ForeverAngry/rig-model-meta ../rig-model-catalog
          git clone --depth=1 https://github.com/ForeverAngry/rig-memvid ../rig-memvid
          git clone --depth=1 https://github.com/ForeverAngry/rig-evals-rag ../rig-evals-rag
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.features }}
      - name: clippy
        shell: bash
        run: |
          case "${{ matrix.features }}" in
            default) cargo clippy --all-targets -- -D warnings ;;
            no-default) cargo clippy --no-default-features --all-targets -- -D warnings ;;
            all-features) cargo clippy --all-targets --all-features -- -D warnings ;;
            *) cargo clippy --no-default-features --features "${{ matrix.features }}" --all-targets -- -D warnings ;;
          esac

  test:
    name: test (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features:
          - "default"
          - "no-default"
          - "all-features"
    steps:
      - uses: actions/checkout@v4
      - name: checkout companion path dependencies
        shell: bash
        run: |
          git clone --depth=1 https://github.com/ForeverAngry/rig-tap ../rig-tap
          git clone --depth=1 https://github.com/ForeverAngry/rig-model-meta ../rig-model-catalog
          git clone --depth=1 https://github.com/ForeverAngry/rig-memvid ../rig-memvid
          git clone --depth=1 https://github.com/ForeverAngry/rig-evals-rag ../rig-evals-rag
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.features }}
      - name: test
        shell: bash
        run: |
          case "${{ matrix.features }}" in
            default) cargo test --all-targets ;;
            no-default) cargo test --no-default-features --all-targets ;;
            all-features) cargo test --all-features --all-targets ;;
          esac

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout companion path dependencies
        run: |
          git clone --depth=1 https://github.com/ForeverAngry/rig-tap ../rig-tap
          git clone --depth=1 https://github.com/ForeverAngry/rig-model-meta ../rig-model-catalog
          git clone --depth=1 https://github.com/ForeverAngry/rig-memvid ../rig-memvid
          git clone --depth=1 https://github.com/ForeverAngry/rig-evals-rag ../rig-evals-rag
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo build --all-targets --all-features

  docs:
    name: rustdoc strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout companion path dependencies
        run: |
          git clone --depth=1 https://github.com/ForeverAngry/rig-tap ../rig-tap
          git clone --depth=1 https://github.com/ForeverAngry/rig-model-meta ../rig-model-catalog
          git clone --depth=1 https://github.com/ForeverAngry/rig-memvid ../rig-memvid
          git clone --depth=1 https://github.com/ForeverAngry/rig-evals-rag ../rig-evals-rag
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout companion path dependencies
        run: |
          git clone --depth=1 https://github.com/ForeverAngry/rig-tap ../rig-tap
          git clone --depth=1 https://github.com/ForeverAngry/rig-model-meta ../rig-model-catalog
          git clone --depth=1 https://github.com/ForeverAngry/rig-memvid ../rig-memvid
          git clone --depth=1 https://github.com/ForeverAngry/rig-evals-rag ../rig-evals-rag
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish
      - run: cargo publish --dry-run
